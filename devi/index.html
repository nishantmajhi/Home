    <script>
      /*
       * The <noscript> block above carries a complete 2D version of this page,
       * for a visitor who has JavaScript switched off. It does not cover the
       * commoner failure: JavaScript on and three.js or WebGL unavailable - a
       * blocked or unreachable CDN, an offline machine, WebGL disabled, a
       * device whose driver will not give a browser a context. The engine then
       * threw on its first line and what was left was a black page, scroll
       * locked, carrying a heading and a button that did nothing.
       *
       * <noscript> content is parsed as text when scripting is enabled, so its
       * textContent is the markup, and this puts it back as markup.
       */
      function showFallback() {
        var source = document.querySelector("noscript");
        if (!source) return false;
        // The scroll lock is an inline style and outranks the 2D stylesheet.
        document.documentElement.style.overflow = "";
        document.body.style.overflow = "";
        document.body.innerHTML = source.textContent;
        return true;
      }
    </script>
    <script>
      function startYantra() {
        const HEADER_H = 100; // px - matches --header-h
        const FOOTER_H = 64; // px - matches --footer-h

        function vw() {
          return window.innerWidth;
        }
        function vh() {
          return window.innerHeight;
        }

        /* --- Auto-fit camera Z so yantra fills screen with margin -- */
        function computeCameraZ() {
          const halfFovTan = Math.tan((42 * Math.PI) / 180 / 2);
          const YANTRA_HALF = 4.85; // outer square half-size (world units)
          const MARGIN = 1.28; // 28% breathing room on all sides
          const needed = YANTRA_HALF * MARGIN;

          const usableH = vh() - HEADER_H - FOOTER_H;
          const aspect = vw() / vh();

          // Z so yantra fits vertically inside the usable (header/footer-clipped) band
          const zForH = (needed * vh()) / (usableH * halfFovTan);
          // Z so yantra fits horizontally inside the full viewport width
          const zForW = needed / (aspect * halfFovTan);

          // Use whichever constraint is tighter; clamp to sane zoom range
          return Math.min(Math.max(Math.max(zForH, zForW), 8), 30);
        }

        /* --- Scene / Camera / Renderer ---------------------------- */
        const canvas = document.getElementById("three-canvas");
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, vw() / vh(), 0.1, 300);
        camera.position.set(0, 0, computeCameraZ());
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
        });
        renderer.setSize(vw(), vh());
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);

        /* --- Vertical centering in usable area -------------------- */
        function shiftScene() {
          const usableH = vh() - HEADER_H - FOOTER_H;
          const centerY = HEADER_H + usableH / 2;
          const offsetPx = vh() / 2 - centerY;
          const fovRad = (42 * Math.PI) / 180;
          const worldH = 2 * Math.tan(fovRad / 2) * camera.position.z;
          Y.position.y = (offsetPx / vh()) * worldH;
        }

        /* --- Materials --------------------------------------------- */
        const MAT = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.82,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const MAT_DIM = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.35,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const MAT_BRIGHT = new THREE.LineBasicMaterial({
          color: 0xfffdf0,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        /* --- Z Levels ---------------------------------------------- */
        const Z = {
          bindu: 4.4,
          tri: [3.5, 2.85, 2.25, 1.68, 1.15],
          circ: [0.98, 0.7, 0.42, 0.14], // 4 circles
          petals: -0.55,
          ocirc: [-1.1, -1.38], // 2 outer circles
          sqIn: -1.65,
          gates: -2.15,
          sqO1: -2.55,
          sqO2: -2.85,
        };

        /* --- Yantra dimensions ------------------------------------- */
        const TRI_R = [0.52, 0.82, 1.15, 1.5, 1.9];
        const CIRC_R = [1.95, 2.1, 2.25, 2.4]; // 4 inner circles
        const PET_IN = 2.4,
          PET_OUT = 3.15;
        const OC_R = [3.55, 3.76]; // 2 outer circles
        const SQ_IN = 3.92;
        const G1 = 1.18,
          G2 = 0.66;
        const SQ_O1 = 4.65,
          SQ_O2 = 4.85;

        /* --- Helpers ----------------------------------------------- */
        function mkLine(pts, mat) {
          return new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            mat || MAT,
          );
        }
        function mkCircle(r, z, segs, mat) {
          const pts = [],
            n = segs || 128;
          for (let i = 0; i <= n; i++) {
            const a = (i / n) * Math.PI * 2;
            pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, z));
          }
          return mkLine(pts, mat);
        }
        function mkSquare(h, z, mat) {
          return mkLine(
            [
              new THREE.Vector3(-h, h, z),
              new THREE.Vector3(h, h, z),
              new THREE.Vector3(h, -h, z),
              new THREE.Vector3(-h, -h, z),
              new THREE.Vector3(-h, h, z),
            ],
            mat,
          );
        }
        function mkDownTri(R, z, mat) {
          const s3 = Math.sqrt(3);
          return mkLine(
            [
              new THREE.Vector3((-R * s3) / 2, R / 2, z),
              new THREE.Vector3((R * s3) / 2, R / 2, z),
              new THREE.Vector3(0, -R, z),
              new THREE.Vector3((-R * s3) / 2, R / 2, z),
            ],
            mat,
          );
        }
        function mkLotus(innerR, outerR, z, n, mat) {
          n = n || 8;
          const g = new THREE.Group();
          const offset = Math.PI / n;
          for (let i = 0; i < n; i++) {
            const a0 = (i / n) * Math.PI * 2 + offset;
            const a1 = ((i + 1) / n) * Math.PI * 2 + offset;
            const aMid = (a0 + a1) / 2;
            const lx = Math.cos(a0) * innerR,
              ly = Math.sin(a0) * innerR;
            const rx = Math.cos(a1) * innerR,
              ry = Math.sin(a1) * innerR;
            const tx = Math.cos(aMid) * outerR,
              ty = Math.sin(aMid) * outerR;
            const cR = outerR * 1.08;
            const acL = a0 * 0.35 + aMid * 0.65;
            const acR = aMid * 0.65 + a1 * 0.35;
            const clx = Math.cos(acL) * cR,
              cly = Math.sin(acL) * cR;
            const crx = Math.cos(acR) * cR,
              cry = Math.sin(acR) * cR;
            g.add(
              mkLine(
                new THREE.QuadraticBezierCurve3(
                  new THREE.Vector3(lx, ly, z),
                  new THREE.Vector3(clx, cly, z),
                  new THREE.Vector3(tx, ty, z),
                ).getPoints(36),
                mat,
              ),
            );
            g.add(
              mkLine(
                new THREE.QuadraticBezierCurve3(
                  new THREE.Vector3(tx, ty, z),
                  new THREE.Vector3(crx, cry, z),
                  new THREE.Vector3(rx, ry, z),
                ).getPoints(36),
                mat,
              ),
            );
          }
          return g;
        }
        function mkGate(g1, g2, iY, oY, mat) {
          const mid = (iY + oY) / 2;
          const grp = new THREE.Group();
          grp.add(
            mkLine(
              [
                new THREE.Vector3(-g1, iY, 0),
                new THREE.Vector3(-g1, mid, 0),
                new THREE.Vector3(g1, mid, 0),
                new THREE.Vector3(g1, iY, 0),
              ],
              mat,
            ),
          );
          grp.add(
            mkLine(
              [
                new THREE.Vector3(-g2, mid, 0),
                new THREE.Vector3(-g2, oY, 0),
                new THREE.Vector3(g2, oY, 0),
                new THREE.Vector3(g2, mid, 0),
              ],
              mat,
            ),
          );
          return grp;
        }

        /* --- Build Yantra ------------------------------------------ */
        const Y = new THREE.Group();
        scene.add(Y);
        shiftScene();

        // 1. Bindu
        const bindMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.065, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xffffff }),
        );
        bindMesh.position.z = Z.bindu;
        Y.add(bindMesh);

        const glowMesh = new THREE.Mesh(
          new THREE.CircleGeometry(0.18, 32),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide,
          }),
        );
        glowMesh.position.z = Z.bindu - 0.01;
        Y.add(glowMesh);

        // 2. Trikona
        TRI_R.forEach((R, i) =>
          Y.add(mkDownTri(R, Z.tri[i], i === 0 ? MAT_BRIGHT : MAT)),
        );
        // 3. Chakra
        CIRC_R.forEach((R, i) => Y.add(mkCircle(R, Z.circ[i], 128, MAT)));
        // 4. Padma
        Y.add(mkLotus(PET_IN, PET_OUT, Z.petals, 8, MAT));
        // 5. Outer circles (×2)
        OC_R.forEach((r, i) => Y.add(mkCircle(r, Z.ocirc[i], 192, MAT)));
        // 6. Bhupura inner square
        Y.add(mkSquare(SQ_IN, Z.sqIn, MAT));
        // 7. Gates
        [0, Math.PI, -Math.PI / 2, Math.PI / 2].forEach((rot) => {
          const g = mkGate(G1, G2, SQ_IN, SQ_O1, MAT);
          g.rotation.z = rot;
          g.position.z = Z.gates;
          Y.add(g);
        });
        // 8. Outer double square
        Y.add(mkSquare(SQ_O1, Z.sqO1, MAT));
        Y.add(mkSquare(SQ_O2, Z.sqO2, MAT_DIM));

        /* --- Starfield --------------------------------------------- */
        const starVerts = [];
        for (let i = 0; i < 2200; i++) {
          starVerts.push(
            (Math.random() - 0.5) * 90,
            (Math.random() - 0.5) * 90,
            -25 - Math.random() * 40,
          );
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(starVerts, 3),
        );
        scene.add(
          new THREE.Points(
            starGeo,
            new THREE.PointsMaterial({
              color: 0xffffff,
              size: 0.055,
              transparent: true,
              opacity: 0.45,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              sizeAttenuation: true,
            }),
          ),
        );

        /* --- Interaction ------------------------------------------- */
        window.__yantra = {
          autoRotate: false,
          setAuto: (v) => {
            window.__yantra.autoRotate = v;
          },
        };

        const btn = document.getElementById("auto-btn");

        function syncBtn(state) {
          if (state) {
            btn.textContent = "⟳\u00a0\u00a0Auto-Rotating";
            btn.classList.add("active");
          } else {
            btn.textContent = "▷\u00a0\u00a0Resume Rotation";
            btn.classList.remove("active");
          }
        }

        btn.addEventListener("click", () => {
          const next = !window.__yantra.autoRotate;
          if (next) autoY = cRY;
          window.__yantra.setAuto(next);
          syncBtn(next);
        });

        let drag = false,
          prev = { x: 0, y: 0 };
        let tRX = 0,
          tRY = 0,
          cRX = 0,
          cRY = 0,
          autoY = 0;
        Y.rotation.x = 0;
        Y.rotation.y = 0;

        const getPos = (e) =>
          e.touches
            ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
            : { x: e.clientX, y: e.clientY };

        document.addEventListener("mousedown", (e) => {
          if (e.target === btn) return;
          drag = true;
          window.__yantra.setAuto(false);
          syncBtn(false);
          prev = getPos(e);
        });
        document.addEventListener(
          "touchstart",
          (e) => {
            if (e.target === btn) return;
            drag = true;
            window.__yantra.setAuto(false);
            syncBtn(false);
            prev = getPos(e);
          },
          { passive: true },
        );

        document.addEventListener("mousemove", (e) => {
          if (!drag) return;
          const p = getPos(e);
          tRY += (p.x - prev.x) * 0.009;
          tRX += (p.y - prev.y) * 0.009;
          tRX = Math.max(-1.3, Math.min(1.3, tRX));
          prev = p;
        });
        document.addEventListener(
          "touchmove",
          (e) => {
            if (!drag) return;
            const p = getPos(e);
            tRY += (p.x - prev.x) * 0.009;
            tRX += (p.y - prev.y) * 0.009;
            tRX = Math.max(-1.3, Math.min(1.3, tRX));
            prev = p;
          },
          { passive: true },
        );

        document.addEventListener("mouseup", () => (drag = false));
        document.addEventListener("touchend", () => (drag = false));

        document.addEventListener(
          "wheel",
          (e) => {
            camera.position.z = Math.max(
              5,
              Math.min(30, camera.position.z + e.deltaY * 0.012),
            );
            shiftScene();
          },
          { passive: true },
        );

        document.addEventListener("dblclick", (e) => {
          if (e.target === btn) return;
          tRX = 0;
          tRY = 0;
          cRX = 0;
          cRY = 0;
          autoY = 0;
          Y.rotation.x = 0;
          Y.rotation.y = 0;
          camera.position.z = computeCameraZ();
          shiftScene();
        });

        /* --- Animation loop ---------------------------------------- */
        const clock = new THREE.Clock();
        let time = 0;

        (function animate() {
          requestAnimationFrame(animate);
          const dt = clock.getDelta();
          time += dt;

          if (window.__yantra.autoRotate) {
            autoY += dt * 0.22;
            Y.rotation.y = autoY;
            Y.rotation.x = cRX + (0 - cRX) * 0.05;
            cRX = Y.rotation.x;
            tRX = cRX;
            tRY = autoY;
          } else {
            cRX += (tRX - cRX) * 0.07;
            cRY += (tRY - cRY) * 0.07;
            Y.rotation.x = cRX;
            Y.rotation.y = cRY;
          }

          const pulse = 1 + 0.28 * Math.sin(time * 2.6);
          bindMesh.scale.setScalar(pulse);
          glowMesh.scale.setScalar(pulse * 1.8);
          glowMesh.material.opacity = 0.06 + 0.05 * Math.sin(time * 2.6);

          renderer.render(scene, camera);
        })();

        /* --- Resize ------------------------------------------------ */
        window.addEventListener("resize", () => {
          camera.aspect = vw() / vh();
          camera.updateProjectionMatrix();
          renderer.setSize(vw(), vh());
          camera.position.z = computeCameraZ();
          shiftScene();
        });
      }
    </script>
    <script>
      (function () {
        if (typeof THREE === "undefined") {
          showFallback();
          return;
        }
        // Lock scroll for the 3D experience - after, not before, the page
        // knows it has a 3D experience to lock the scroll for.
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
        try {
          startYantra();
        } catch (error) {
          // WebGLRenderer throws here when there is no context to be had.
          console.error("The 3D yantra could not start:", error);
          showFallback();
        }
      })();
    </script>
  </body>
</html>
